name: Genera JSON-DIFF per MikroTik

on:
  schedule:
    # Due esecuzioni indipendenti (UTC, minuti "storti" per evitare i picchi di GitHub).
    # Se una viene saltata, l'altra aggiorna comunque i JSON prima delle 03:00 italiane.
    - cron: '17 22 * * *'
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copia Blocklist XL
        run: |
          curl -sS https://multiduplikator-group.gitlab.io/mikrotik_blocklist/blocklist_xl.json -o blocklist_xl.json

      - name: Converte WIFX e GeoIP in JSON-DIFF
        run: |
          cat << 'EOF' > convert.py
          import urllib.request, re, json, time, sys

          def make_json(urls, outfile):
              tree = {}
              count = 0
              pat = re.compile(r'address="?([0-9]{1,3})\.([0-9]{1,3})\.([0-9a-zA-Z\.\/]+)"?')
              for u in urls:
                  try:
                      req = urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0'})
                      response = urllib.request.urlopen(req)
                      for line in response.read().decode('utf-8', errors='ignore').splitlines():
                          m = pat.search(line)
                          if m:
                              o1, o2, rest = m.groups()
                              if o1 not in tree: tree[o1] = {}
                              if o2 not in tree[o1]: tree[o1][o2] = {}
                              tree[o1][o2][rest] = 1
                              count += 1
                  except Exception as e:
                      print(f"ATTENZIONE: Errore nel recupero di {u}: {e}")

              if count > 0:
                  out_data = {"#": {"format": 1, "entries": count, "generated": int(time.time())}}
                  for k, v in tree.items():
                      out_data[k] = v

                  with open(outfile, 'w', encoding='utf-8') as f:
                      json.dump(out_data, f, separators=(',', ':'), ensure_ascii=False)
                  print(f"SUCCESSO: {outfile} generato con {count} entries.")
              else:
                  print(f"ERRORE: Nessun IP trovato per {outfile}.")

          print("Generazione WIFX JSON...")
          make_json(['https://blocklist.wifx.net/all.rsc'], 'wifx.json')

          print("Generazione GeoIP JSON (CN, RU, KP, IR)...")
          countries = ["CN", "RU", "KP", "IR"]
          geo = [f"https://raw.githubusercontent.com/mo13ammad/Country-IP-List/main/generated/{c}.rsc" for c in countries]
          make_json(geo, 'geoip.json')
          EOF
          python3 convert.py

      - name: Salva nel Repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add *.json
          git commit -m "Auto-update JSON" || echo "Nessuna modifica"
          git push --force
