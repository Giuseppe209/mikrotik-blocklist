name: Genera JSON-DIFF per MikroTik

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Elabora liste RSC in formato JSON-DIFF
        run: |
          cat << 'EOF' > convert.py
          import urllib.request, re, json, time

          def make_json(urls, outfile):
              tree = {}
              count = 0
              # Estrae solo gli IP IPv4 e le Subnet ignorando i commenti
              pat = re.compile(r'address="?([0-9]{1,3})\.([0-9]{1,3})\.([0-9a-zA-Z\.\/]+)"?')
              for u in urls:
                  try:
                      req = urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0'})
                      for line in urllib.request.urlopen(req).read().decode('utf-8').splitlines():
                          m = pat.search(line)
                          if m:
                              o1, o2, rest = m.groups()
                              if o1 not in tree: tree[o1] = {}
                              if o2 not in tree[o1]: tree[o1][o2] = {}
                              if rest not in tree[o1][o2]:
                                  tree[o1][o2][rest] = 1
                                  count += 1
                  except Exception as e:
                      print(f"Errore su {u}: {e}")
              
              # Crea i metadati richiesti dallo script MikroTik
              out_data = {"#": {"format": 1, "entries": count, "generated": int(time.time())}}
              out_data.update(tree)
              with open(outfile, 'w') as f:
                  json.dump(out_data, f, separators=(',', ':'))

          print("Generazione WIFX JSON...")
          make_json(['https://blocklist.wifx.net/all.rsc'], 'wifx.json')

          print("Generazione GeoIP JSON (CN, RU, KP, IR)...")
          countries = ["CN", "RU", "KP", "IR"]
          geo = [f"https://raw.githubusercontent.com/mo13ammad/Country-IP-List/main/generated/{c}.rsc" for c in countries]
          make_json(geo, 'geoip.json')
          EOF
          python3 convert.py

      - name: Salva nel Repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add wifx.json geoip.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update JSON"
          git push
